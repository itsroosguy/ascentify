                      <div className="font-bold text-slate-900 text-base">{t.author}</div>

                      <div className="text-xs text-slate-500 font-medium">{t.org}</div>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* FINAL CTA SECTION */}
          <section className="py-24 bg-gradient-to-b from-white to-slate-50 border-t border-slate-200 text-center">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
              
              <h2 className="text-3xl sm:text-5xl font-extrabold text-slate-950 leading-tight">
                Workforce Development That Delivers Measurable Outcomes
              </h2>

              <p className="text-lg text-slate-600 max-w-3xl mx-auto">
                Ascentify helps organizations move beyond training completion and focus on what truly matters:
              </p>

              <div className="flex flex-wrap justify-center gap-3 max-w-3xl mx-auto">
                {[
                  'Workforce Readiness',
                  'Communication Excellence',
                  'Skill Development',
                  'Performance Improvement',
                  'Business Impact'
                ].map((item, idx) => (
                  <div key={idx} className="px-4 py-2.5 rounded-2xl bg-white border border-slate-200 font-bold text-sm text-slate-800 shadow-sm">
                    {item}
                  </div>
                ))}
              </div>

              <div className="text-2xl sm:text-3xl font-extrabold text-cyan-700 pt-4">
                Transform learning into measurable workforce capability.
              </div>

              <div className="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                <button onClick={() => openModal('Book a Demo')} className="px-8 py-4 font-bold text-white bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-600 rounded-2xl shadow-xl shadow-cyan-600/25">
                  Book a Demo
                </button>
                <button onClick={() => openModal('Request Pricing')} className="px-8 py-4 font-bold text-slate-800 bg-slate-100 border border-slate-300/80 rounded-2xl">
                  Request Pricing
                </button>
                <button onClick={() => openModal('Talk to a Specialist')} className="px-8 py-4 font-bold text-slate-700 bg-white border border-slate-200 rounded-2xl shadow-sm">
                  Talk to a Specialist
                </button>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 py-12 text-center text-xs border-t border-slate-900">
            <div className="max-w-7xl mx-auto px-4">
              <div className="font-bold text-white text-lg mb-1">ASCENTIFY LEARNING MEDIA</div>
              <p className="mb-4 text-slate-400">Ascentify eSuite • Transforming Workforce Capability Into Business Performance</p>
              <p className="text-slate-500">© {new Date().getFullYear()} Ascentify Learning Media. All rights reserved.</p>
            </div>
          </footer>

          {/* LEAD CAPTURE MODAL */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md">
              <div className="relative w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 shadow-2xl text-left">
                <button onClick={() => setModalOpen(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-900">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                {!submitted ? (
                  <div>
                    <h3 className="text-xl font-bold text-slate-900 mb-1">{modalType}</h3>
                    <p className="text-xs text-slate-500 mb-4">Fill in your details to connect with an Ascentify eSuite expert.</p>
                    
                    <form onSubmit={(e) => { e.preventDefault(); setSubmitted(true); }} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                        <input type="text" required placeholder="Alex Smith" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-900 focus:outline-none focus:border-cyan-600" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Work Email</label>
                        <input type="email" required placeholder="alex@company.com" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-900 focus:outline-none focus:border-cyan-600" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Company / Organization</label>
                        <input type="text" required placeholder="Enterprise Corp / University" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-900 focus:outline-none focus:border-cyan-600" />
                      </div>
                      <button type="submit" className="w-full py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-xs rounded-xl shadow-md mt-2">
                        Submit Request
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="py-6 text-center space-y-3">
                    <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto">
                      <Icon name="check-circle" className="w-6 h-6" />
                    </div>
                    <h4 className="text-lg font-bold text-slate-900">Thank You!</h4>
                    <p className="text-xs text-slate-600">Your request has been received. An Ascentify eSuite representative will contact you shortly.</p>
                    <button onClick={() => setModalOpen(false)} className="px-4 py-2 bg-slate-100 text-slate-800 font-bold text-xs rounded-xl">Close</button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
