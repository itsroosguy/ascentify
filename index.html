    // Main App Component
    function App() {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenu, setMobileMenu] = useState(false);
      const [activeSample, setActiveSample] = useState(SAMPLES[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [activeCapCategory, setActiveCapCategory] = useState('All Capabilities');
      const [activeSolution, setActiveSolution] = useState(SOLUTIONS[0]);
      const [modalOpen, setModalOpen] = useState(false);
      const [modalType, setModalType] = useState('Book a Demo');
      const [submitted, setSubmitted] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setProgress(prev => {
              if (prev >= 100) {
                setIsPlaying(false);
                return 100;
              }
              return prev + 3;
            });
          }, 100);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      const openModal = (type = 'Book a Demo') => {
        setModalType(type);
        setSubmitted(false);
        setModalOpen(true);
      };

      const handlePlayToggle = () => {
        if (progress >= 100) setProgress(0);
        setIsPlaying(!isPlaying);
      };

      const filteredCapabilities = activeCapCategory === 'All Capabilities'
        ? CAPABILITIES
        : CAPABILITIES.filter(c => c.category === activeCapCategory);

        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">

                <a href="#why-ascentify" className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 rounded-full transition-all">Why Ascentify</a>
                <a href="#ecosystem" className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 rounded-full transition-all">Ecosystem</a>
                <a href="#capabilities" className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 rounded-full transition-all">Capabilities</a>
                <a href="#solutions" className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 rounded-full transition-all">Solutions</a>
                <a href="#comparison" className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 rounded-full transition-all">Comparison</a>
              </div>

                      </p>
                    </div>

                    <div>
                      {/* Wave visualizer */}
                      <div className="h-14 bg-slate-900 rounded-xl p-3 flex items-center justify-center gap-1 border border-slate-800 mb-4">
                        {Array.from({ length: 32 }).map((_, idx) => {
                          const isActive = isPlaying && (idx / 32) * 100 <= progress;
                          const heightPct = isPlaying ? Math.sin(idx * 0.5 + progress * 0.3) * 40 + 50 : 30;
                          return (
                            <div
                              key={idx}
                              className={`w-1 rounded-full transition-all ${isActive ? 'bg-cyan-400' : 'bg-slate-700'}`}
                              style={{ height: `${Math.max(15, heightPct)}%` }}
                            />
                          );
                        })}
                      </div>

                      <div className="flex items-center gap-4">

                          </div>

                      </div>

                        <span className="text-emerald-400 text-[10px] bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">Objective</span>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                          <div className="flex justify-between font-semibold mb-1">
                            <span className="text-slate-300">Spoken English Proficiency</span>
                            <span className="text-cyan-400">{activeSample.scores.proficiency}</span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-cyan-400" style={{ width: '94%' }}></div>
                          </div>
                        </div>

                        <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                          <div className="flex justify-between font-semibold mb-1">
                            <span className="text-slate-300">Pronunciation Accuracy</span>
                            <span className="text-sky-400">{activeSample.scores.pronunciation}%</span>
                          </div>
                          <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-sky-400" style={{ width: `${activeSample.scores.pronunciation}%` }}></div>
                          </div>
                        </div>

                        <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                          <div className="flex justify-between font-semibold mb-1">
                            <span className="text-slate-300">Fluency & Clarity</span>
