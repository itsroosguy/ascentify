                  </button>
                  <button onClick={() => openModal('Request Pricing')} className="px-7 py-3.5 font-bold text-slate-200 bg-slate-900 border border-slate-800 rounded-xl text-xs">
                    Request Pricing
                  </button>
                  <button onClick={() => openModal('Talk to a Specialist')} className="px-7 py-3.5 font-bold text-slate-300 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                    Talk to a Specialist
                  </button>
                </div>

              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 py-10 text-center text-xs border-t border-slate-900">
            <div className="max-w-7xl mx-auto px-4">
              <div className="font-bold text-white text-base mb-1">ASCENTIFY LEARNING MEDIA</div>
              <p className="mb-3 text-slate-400">Ascentify eSuite • Transforming Workforce Capability Into Business Performance</p>
              <p className="text-slate-500">© {new Date().getFullYear()} Ascentify Learning Media Inc. All rights reserved.</p>
            </div>
          </footer>

          {/* LEAD CAPTURE MODAL */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in-up">
              <div className="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-left text-slate-100">
                <button onClick={() => setModalOpen(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-white" aria-label="Close dialog">
                  <Icon name="x" className="w-5 h-5" />
                </button>

                {!submitted ? (
                  <div>
                    <h3 className="text-xl font-bold text-white mb-1">{modalType}</h3>
                    <p className="text-xs text-slate-400 mb-4">Fill in your details to connect with an Ascentify eSuite expert.</p>
                    
                    <form onSubmit={(e) => { e.preventDefault(); setSubmitted(true); }} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Full Name</label>
                        <input type="text" required placeholder="Alex Smith" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Work Email</label>
                        <input type="email" required placeholder="alex@company.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Company / Organization</label>
                        <input type="text" required placeholder="Enterprise Corp / University" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500" />
                      </div>
                      <button type="submit" className="w-full py-3 bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg mt-2">
                        Submit Request
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="py-6 text-center space-y-3">
                    <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto animate-bounce">
                      <Icon name="check-circle" className="w-6 h-6" />
                    </div>
                    <h3 className="text-lg font-bold text-white">Thank You!</h3>
                    <p className="text-xs text-slate-300">Your request has been received. An Ascentify eSuite representative will contact you shortly.</p>
                    <button onClick={() => setModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-200 font-bold text-xs rounded-xl hover:bg-slate-700">Close</button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
